version = 1
SPDX-PackageName = "koh/sylius-indexnow"
SPDX-PackageSupplier = "Kai Ole Hartwig <mail@ole-hartwig.eu>"
SPDX-PackageDownloadLocation = "https://github.com/ole-hartwig/sylius-indexnow"

# Config, metadata and repo-template files: no comment syntax that survives
# their tooling (JSON), generated by tooling (CHANGELOG.md) or copied verbatim
# from devops/repo-templates, where a per-file header would drift from the
# source on the next sync.
[[annotations]]
path = [
    ".gitattributes",
    ".gitignore",
    ".gitsigners",
    ".gitsigners.d/**",
    ".markdownlint.jsonc",
    ".markdownlint-cli2.jsonc",
    ".mise.toml",
    "composer.json",
    "renovate.json",
    "infection.json5",
    "lefthook.yml",
    "phpstan.neon",
    "phpunit.xml.dist",
    "CHANGELOG.md",
    "SECURITY.md",
    ".well-known/security.txt",
    ".gitlab/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Kai Ole Hartwig"
SPDX-License-Identifier = "MIT"
